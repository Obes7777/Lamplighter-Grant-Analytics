
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Data Filtering Workspace</title>
	<!-- External CSS for wireframe look and layout -->
	<link rel="stylesheet" href="style/workspaceStyle.css">

    <!--SCRIPT TESTING-->
    <script src="API/adjusterV2.js" defer></script>


</head>
<body>
	<!-- Header Section -->
	<header id="app-header">
		<div class="header-left">
			<!-- Undo and Redo buttons -->
			<button class="header-btn" title="Undo" id="Undo">&#8630;</button>
			<button class="header-btn" title="Redo" id="Redo">&#8631;</button>
		</div>
		<div class="header-title">
			<h1>Workspace</h1>
		</div>
		<div class="header-right">
			<!-- Action Toolbar: Contains dropdown menus and standalone button -->
			<div class="action-toolbar">
				<!-- Dropdown 1: Import -->
				<div class="dropdown">
					<button class="dropdown-trigger">Import</button>
					<ul class="dropdown-content">
						<li>Import new xls/xlsx</li>
						<li>Import existing .wrkspc</li>
						<li>Import existing .fltr</li>
					</ul>
				</div>
				<!-- Dropdown 2: Export -->
				<div class="dropdown">
					<button class="dropdown-trigger">Export</button>
					<ul class="dropdown-content">
						<li>Export filters to .fltr</li>
						<li>Export as .wrkspc</li>
					</ul>
				</div>
				<!-- Dropdown 3: Merge -->
				<div class="dropdown">
					<button class="dropdown-trigger">Merge</button>
					<ul class="dropdown-content">
						<li>Merge xls/xlsx</li>
						<li>Merge .wrkspc</li>
						<li>Merge .fltr</li>
					</ul>
				</div>
				<!-- Standalone Button: Frequently used action -->
				<button class="action-btn">Push current filter to filter list</button>
			</div>
		</div>
	</header>

	<!-- Top Workspace Section -->
	<section id="filter-workspace">
		<!-- Left: Filter carousel -->
		<div class="filter-carousel" id="filter-container">

		</div>
		<!-- Right: Active filters and count -->
		<div class="active-filters-container">
			<div class="active-filters-box">
				<div class="active-filters-box-header">
					<span class="minimize-icon">&#x2212;</span> Current Filters
				</div>
				<div id="active-filters-list" class="active-filters-list">
				</div>
			</div>
			<div class="filtered-count-box">
				<div class="filtered-count-box-header">Filtered Count</div>
				<div id="filtered-count-text" style="padding-top:0.5rem;"></div>
			</div>
		</div>
	</section>

	<!-- Middle Section: Saved Filter Lists -->
	<section id="saved-filter-lists">

	</section>

	<!-- Bottom Section: Data Grid -->
	<section id="data-grid-container">
		<table class="data-grid-table">
			<tbody>
			</tbody>
		</table>
	</section>
</body>
</html>
